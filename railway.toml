# Railway Config — https://docs.railway.com/reference/config-as-code
# Deploy: railway.app → New Project → Deploy from GitHub repo → LFnote
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = 'node server/scripts/init-db.mjs && node server/index.js'
healthcheckPath = "/api/openapi.json"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
